<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Tour Virtual 360 - FICA</title>
    <meta name="description" content="Laboratorios FICA - UNSL">
    <style>
      #start-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        color: white; font-family: sans-serif;
        z-index: 9999;
      }
      #start-btn {
        padding: 15px 30px; font-size: 20px;
        background-color: #00D2FF; color: black;
        border: none; border-radius: 5px; cursor: pointer;
        margin-top: 20px; font-weight: bold;
      }
    </style>

    <!-- Componentes de interacción y layout -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-template-component@3.2.2/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- Componente para rotar los CARTELES hacia la cámara SOLO en el eje Y -->
    <script>
      AFRAME.registerComponent('look-at-y', {
        init: function () {
          this.targetPos = new THREE.Vector3();
          this.objPos = new THREE.Vector3();
        },
        tick: function () {
          var cameraEl = this.el.sceneEl.camera ? this.el.sceneEl.camera.el : null;
          if (!cameraEl) return;
          cameraEl.object3D.getWorldPosition(this.targetPos);
          this.el.object3D.getWorldPosition(this.objPos);
          this.targetPos.y = this.objPos.y;
          this.el.object3D.lookAt(this.targetPos);
        }
      });
    </script>

    <!-- Componente unificado de audios de fondo -->
    <script>
      // Ahora incluimos TODOS los audios (incluyendo los del CIEM)
      const roomAudios = [
        'audio-bienvenidaEntrada', 'audio-bienvenida', 'audio-bienvenidaCIEM', 
        'audio-cxn1', 'audio-tesis', 'audio-delta', 'audio-impresoras', 'audio-brazoABB',
        'audio-charpy', 'audio-traccion', 'audio-compresion', 'audio-tesisCinta'
      ];
      
      function playRoomAudio(audioId) {
        roomAudios.forEach(function(id) {
          var audio = document.getElementById(id);
          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }
        });
        if (audioId) {
          var audioToPlay = document.getElementById(audioId);
          if (audioToPlay) {
            audioToPlay.play().catch(function(error) {
               console.log("Esperando interacción para reproducir audio.");
            });
          }
        }
      }
    </script>

    <!-- Componente de navegación con flechas y menú -->
    <script>
      AFRAME.registerComponent('nav-flecha', {
        schema: {
          targetImg: { type: 'string' },
          targetGroup: { type: 'string' },
          roomAudio: { type: 'string', default: '' } 
        },
        init: function () {
          var data = this.data;
          var el = this.el;

          el.addEventListener('click', function () {
            // Reproducir el sonido de transición al hacer clic
            var transitionSound = document.getElementById('Efecto_transicion');
            if (transitionSound) {
                transitionSound.currentTime = 0;
                transitionSound.play();
            }

            var videos = document.querySelectorAll('video');
            videos.forEach(function(vid) { vid.pause(); });

            var sky = document.getElementById('image-360');
            sky.setAttribute('src', data.targetImg);
            sky.setAttribute('visible', 'true');
            
            var videoSphere = document.getElementById('video-360');
            if(videoSphere) videoSphere.setAttribute('visible', 'false');

            var pantallas2d = document.querySelectorAll('a-video');
            pantallas2d.forEach(function(pantalla){ pantalla.setAttribute('visible', 'false'); });

            var grupos = document.querySelectorAll('.grupo-info');
            grupos.forEach(function (g) {
              g.setAttribute('visible', false);
              g.setAttribute('scale', '0 0 0');
            });

            if(data.targetGroup){
                var nuevoGrupo = document.querySelector(data.targetGroup);
                if (nuevoGrupo) {
                  nuevoGrupo.setAttribute('visible', true);
                  nuevoGrupo.setAttribute('scale', '1 1 1');
                }
            }

            playRoomAudio(data.roomAudio);
          });
        }
      });
    </script>

    <!-- Componente para reproducir video 360 -->
    <script>
      AFRAME.registerComponent('play-video-360', {
        schema: {
          targetVideo: { type: 'string' },
          returnImg: { type: 'string' },
          returnGroup: { type: 'string' },
          volumen: { type: 'number', default: 1.0 },
          returnAudio: { type: 'string', default: '' }
        },
        init: function () {
          var data = this.data;
          var el = this.el;

          el.addEventListener('click', function () {
            playRoomAudio('');

            var videoElement = document.querySelector(data.targetVideo);
            var sky = document.getElementById('image-360');
            var videoSphere = document.getElementById('video-360');

            var grupos = document.querySelectorAll('.grupo-info');
            grupos.forEach(function (g) {
              g.setAttribute('visible', false);
              g.setAttribute('scale', '0 0 0');
            });

            sky.setAttribute('visible', 'false');
            videoSphere.setAttribute('src', data.targetVideo);
            videoSphere.setAttribute('visible', 'true');
            
            videoElement.currentTime = 0;
            videoElement.volume = data.volumen;
            videoElement.play();

            videoElement.onended = function() {
              videoSphere.setAttribute('visible', 'false');
              sky.setAttribute('src', data.returnImg);
              sky.setAttribute('visible', 'true');

              var grupoRegreso = document.querySelector(data.returnGroup);
              if (grupoRegreso) {
                grupoRegreso.setAttribute('visible', true);
                grupoRegreso.setAttribute('scale', '1 1 1');
              }
              playRoomAudio(data.returnAudio);
            };
          });
        }
      });
    </script>

    <!-- Componente para reproducir un video 2D -->
    <script>
      AFRAME.registerComponent('popup-2d-video', {
        schema: {
          videoSrc: { type: 'string' },
          screenId: { type: 'string' },
          volumen: { type: 'number', default: 1.0 },
          playAudioOnStart: { type: 'string', default: '' }
        },
        init: function () {
          var data = this.data;
          var el = this.el;
          
          el.addEventListener('click', function () {
            var videoElement = document.querySelector(data.videoSrc);
            var screenElement = document.querySelector(data.screenId);
            
            if (videoElement.paused) {
              playRoomAudio(data.playAudioOnStart);
              screenElement.setAttribute('visible', 'true');
              videoElement.currentTime = 0;
              videoElement.volume = data.volumen;
              videoElement.play();
            } else {
              videoElement.pause();
              screenElement.setAttribute('visible', 'false');
            }
          });
          
          var vidEl = document.querySelector(data.videoSrc);
          vidEl.addEventListener('ended', function () {
             var screenElement = document.querySelector(data.screenId);
             screenElement.setAttribute('visible', 'false');
          });
        }
      });
    </script>
    
    <!-- Función de arranque -->
    <script>
      function startTour() {
        document.getElementById('start-screen').style.display = 'none';
        playRoomAudio('audio-bienvenidaEntrada');
      }
    </script>
  </head>

      <p>Asegúrate de tener el volumen encendido.</p>
      <button id="start-btn" onclick="startTour()">Entrar al Recorrido</button>

        <img id="img6" crossorigin="anonymous" src="img/img6.jpg">
        <img id="img7" crossorigin="anonymous" src="img/img7.jpg">

        <img id="img7_1" crossorigin="anonymous" src="img/img7.1.jpg">
        <img id="img3_1" crossorigin="anonymous" src="img/img3.1.jpg">

        <audio id="audio-charpy" src="audio/charpy.mp3" preload="auto"></audio>
        <audio id="audio-traccion" src="audio/traccion.mp3" preload="auto"></audio>
        <audio id="audio-compresion" src="audio/compresion.mp3" preload="auto"></audio>

        <audio id="audio-cxn1" src="audio/cxn1.mp3" preload="auto"></audio>
        <audio id="audio-tesis" src="audio/tesis.mp3" preload="auto"></audio>
        <audio id="audio-tesisCinta" src="audio/tesisCinta.mp3" preload="auto"></audio>
        <audio id="audio-delta" src="audio/delta.mp3" preload="auto"></audio>
        <audio id="audio-impresoras" src="audio/impresoras.mp3" preload="auto"></audio>
        <audio id="audio-brazoABB" src="audio/brazoABB.mp3" preload="auto"></audio>

        <!-- Plantilla corregida para botones del menú inferior CIEM (Ahora incluye roomAudio) -->
        <script id="link" type="text/html">
          <a-entity class="link"
            geometry="primitive: plane; height: 1; width: 1"
            material="shader: flat; src: ${thumb}"
            event-set__1="_event: mousedown; scale: 1 1 1"
            event-set__2="_event: mouseup; scale: 1.2 1.2 1"
            event-set__3="_event: mouseenter; scale: 1.2 1.2 1"
            event-set__4="_event: mouseleave; scale: 1 1 1"
            nav-flecha="targetImg: ${src}; targetGroup: ${targetgroup}; roomAudio: ${roomaudio}">
            <a-text value="${title}" align="center" position="0 -0.75 0.05" width="2.8" color="#FFFFFF"></a-text>
          </a-entity>
        </script>
      </a-assets>

      <a-sky id="image-360" radius="10" src="#entradaFICA" visible="true"></a-sky>
      <a-videosphere id="video-360" radius="10" visible="false"></a-videosphere>

      <!-- ============================================================== -->
      <!-- GRUPO ENTRADA FICA -->

        <a-entity position="-2 0.5 -4" look-at-y>

           <a-text value="Ingresar a CIEM" align="center" position="0 -1.2 0" width="4" color="white"></a-text>
        </a-entity>

        <a-entity position="2 0.5 -4" look-at-y>
           <a-image src="#imgLABME" width="2" height="2" class="link" nav-flecha="targetImg: #img1; targetGroup: #grupo-sala1; roomAudio: audio-bienvenida"
                    event-set__enter="_event: mouseenter; scale: 1.1 1.1 1.1" event-set__leave="_event: mouseleave; scale: 1 1 1"></a-image>
           <a-text value="Ingresar a LABME" align="center" position="0 -1.2 0" width="4" color="white"></a-text>
        </a-entity>

          <a-gltf-model src="#flecha3d" scale="0.3 0.3 0.3"></a-gltf-model>
          <a-text value="Volver" align="center" position="0 -0.8 0" rotation="90 0 0" width="3" color="white"></a-text>
        </a-entity>
      </a-entity>

      <!-- ================= SALA 7 (Final del camino 3) ================= -->
      <a-entity id="grupo-sala7" class="grupo-info" visible="false" scale="0 0 0">
        <a-entity position="-3 -1.5 3" rotation="-90 135 140" animation="property: position; to: -3 -1.3 3; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine">
          <a-box class="link" width="1.5" height="1.5" depth="0.5" scale="0.3 0.3 0.3" material="opacity: 0; transparent: true" nav-flecha="targetImg: #img1; targetGroup: #grupo-sala1; roomAudio: audio-bienvenida"></a-box>
          <a-gltf-model src="#flecha3d" scale="0.3 0.3 0.3"></a-gltf-model>
          <a-text value="Volver a Sala 1" align="center" position="0 -0.8 0" rotation="90 0 0" width="3" color="white"></a-text>
        </a-entity>

        <a-entity position="-2.5 1 -1">
          <a-box class="link" width="1.2" height="1.6" depth="1.2" scale="0.2 0.2 0.2" material="opacity: 0; transparent: true"
                 sound__abrir="src: #open_info; on: mouseenter; poolSize: 3; volume: 0.6"
                 sound__cerrar="src: #close_info; on: mouseleave; poolSize: 3; volume: 0.6"
                 event-set__show="_event: mouseenter; _target: #card-info7; visible: true"
                 event-set__hide="_event: mouseleave; _target: #card-info7; visible: false"></a-box>
          <a-gltf-model src="#interrogacion3d" scale="0.2 0.2 0.2" rotation="90 -90 -90" animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear"></a-gltf-model>
          <a-entity id="card-info7" position="0 0.8 0" visible="false" look-at-y>
            <a-plane width="2.6" height="0.8" color="#111" material="opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Impresoras 3D" align="center" position="0 0.3 0.02" width="2.8" color="#00D2FF"></a-text>
            <a-text value="Se utilizan para imprimir piezas de todo tipo." align="center" position="0 -0.1 0.02" width="2.4" color="#FFFFFF" wrap-count="28"></a-text>
          </a-entity>
        </a-entity>

        <a-entity position="-2 1.5 1">
          <a-box class="link" width="1.2" height="1.6" depth="1.2" scale="0.2 0.2 0.2" material="opacity: 0; transparent: true"
                sound__abrir="src: #open_info; on: mouseenter; poolSize: 3; volume: 0.6"
                sound__cerrar="src: #close_info; on: mouseleave; poolSize: 3; volume: 0.6"
                play-video-360="targetVideo: #videoImpresora; returnImg: #img7; returnGroup: #grupo-sala7; volumen: 0.5; returnAudio: audio-impresoras"
                event-set__show="_event: mouseenter; _target: #texto-video1; visible: true"
                event-set__hide="_event: mouseleave; _target: #texto-video1; visible: false">
          </a-box>
          <a-gltf-model src="#video" scale="0.2 0.2 0.2" rotation="0 0 0" animation="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-gltf-model>
          <a-entity id="texto-video1" position="0 0.8 0" visible="false" look-at-y>
            <a-plane width="3" height="0.6" color="#111" material="opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Ver Video: Impresora 3D" align="center" position="0 0 0.02" width="2.8" color="#00D2FF"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- CÁMARA Y PUNTEROS -->
      <a-entity id="camara" camera look-controls position="0 1.6 0">
        <a-cursor id="cursor" animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150" fuse="true" cursor="fuseTimeout: 1000" raycaster="objects: .link"></a-cursor>
      </a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .link; far: 15"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .link; far: 15"></a-entity>
      
    </a-scene>
  </body>
</html>
